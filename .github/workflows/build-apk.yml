name: Build Android APK

# Runs on every push to main/master, and can be started by hand
# from the repo's "Actions" tab (Run workflow).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Uses the latest STABLE Flutter. If `flutter pub get` fails with a
      # "requires SDK version ^3.10.0" message, change `channel: stable`
      # to `channel: beta` below and re-run.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Release APK, signed with the debug key (your build.gradle already
      # points the release signingConfig at debug), so it installs on a
      # tablet by sideloading without any keystore setup.
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: valdor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
