name: Build APK

# Builds a release APK you can download.
#  - On every push to main/master and on manual runs: the APK is uploaded as a
#    build artifact (open the Actions run -> Artifacts -> download "valdor-apk").
#  - On pushing a tag like v1.0.0: the APK is ALSO attached to a GitHub Release.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create a Release on tag pushes

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      # The release build is signed with the debug key
      # (see android/app/build.gradle.kts), so the APK installs with no keystore
      # secrets. Add a real keystore + key.properties later for store releases.
      - name: Build release APK (universal)
        run: flutter build apk --release

      - name: Stage APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/valdor-${GITHUB_SHA::7}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: valdor-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
